<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Смотри фильмы и сериалы онлайн: популярное, топ-250, сериалы и мультфильмы.">
  <title>Movie App — Unlimited movies, TV shows and more</title>
  <link rel="icon" href="icons/Logo (3).svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Roboto:wght@400;500&family=Rubik:wght@300..900&display=swap"
    rel="stylesheet">
  <link rel="preload" as="image" href="img/scale_1200.jpg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/modal.js" defer></script>
</head>

<body>

  <header class="home">
    <div class="container home__container">
      <img src="icons/Component 1.svg" alt="logo" class="logo">
      <div class="home-button">
        <button id="btn-sign" class="btn-sign">Sign in</button>
        <button id="btn-login" class="btn-login">Login</button>
      </div>
    </div>
    <div class="welcome">
      <h1 class="welcome__title">Unlimited movies, TV shows, and more</h1>
      <p class="welcome__desc">Watch anywhere. Watch anytime.</p>
    </div>

    <div id="overlay" class="overlay">
      <div id="modal-login" class="modal-login">
        <div class="modal-login__header">
          <img src="icons/Component 1.svg" alt="logo">
          <button id="closeLogin" class="modal-login__btn btn-big">Close</button>
        </div>
        <div class="modal-login__input">
          <label class="modal-login__text" for="email">Email</label>
          <input placeholder="Email" type="email">
          <label class="modal-login__text" for="password">Password</label>
          <input placeholder="Password" type="password">
        </div>
        <button id="login" class="login-btn btn-big">Login</button>
      </div>


      <div id="modal-sign" class="modal-sign">
        <div class="modal-sign__header">
          <img src="icons/Component 1.svg" alt="logo">
          <button id="closeSign" class="modal-sign__btn btn-big">Close</button>
        </div>
        <div class="modal-sign__input">
          <label class="modal-sign__text" for="username">Username</label>
          <input placeholder="Username" type="text">
          <label class="modal-sign__text" for="email">Email</label>
          <input placeholder="Email" type="email">
          <label class="modal-sign__text" for="password">Password</label>
          <input placeholder="Password" type="password">
        </div>
        <button id="sign" class="sign-btn btn-big">Sign</button>
      </div>
    </div>




  </header>


  <footer class="footer">
    <div class="container footer__container">
      <div class="content">
        <h3 class="content__title">Our platform is trusted by millions & features best updated movies all around the
          world.</h3>
        <div class="content-system">
          <a href="#" class="content__desc">Privacy policy</a>
          <a href="#" class="content__desc">Term of service</a>
          <a href="#" class="content__desc">Language</a>
        </div>
      </div>
      <div class="services">
        <div class="services-section">
          <p class="services__desc">Home /</p>
          <p class="services__desc">Discover /</p>
          <p class="services__desc">Influence /</p>
          <p class="services__desc">Release </p>
        </div>

        <div class="services-coz">
          <img src="icons/Instagram.svg" alt="instagram" class="img-btn">
          <img src="icons/Facebook.svg" alt="instagram" class="img-btn">
          <img src="icons/Twitter.svg" alt="instagram" class="img-btn">
          <img src="icons/Google.svg" alt="instagram" class="img-btn">
        </div>
        <div class="services-age">© 2023
        </div>

      </div>
    </div>
  </footer>




</body>

</html>
