<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icons/Logo (3).svg">
  <script src="js/api.js" defer></script>
  <script src="js/slide.js" defer></script>
  <script src="js/poisk.js" defer></script>
  <title>movie</title>
</head>

<body>
  <header class="header">
    <div class="container header__container">
      <div class="header-top">
        <img src="icons/Component 1.svg" alt="logo" class="logo">
        <nav class="nav">
          <ul class="nav-list">
            <li class="nav-list__item link-hover"><a href="#popular">Popular</a></li>
            <li class="nav-list__item link-hover"><a href="#movies">Movie</a></li>
            <li class="nav-list__item link-hover"><a href="#series">Series</a></li>
            <li class="nav-list__item link-hover"><a href="#cartoons">Сartoons</a></li>
          </ul>
        </nav>
        <div class="header-avatar">
          <form id="form">
            <input id="form-poisk" class="header-avatar__poisk" placeholder="Поиск" type="text">
          </form>
          <button><img src="icons/search.svg" alt="search" class="img-btn btn-poisk"></button>
        </div>
      </div>

      <!-- <div class="header-bottom">
        <div class="info">
          <button class="btn-genre">Series</button>
          <h2 class="info__title">The Last Of Us Season 1</h2>
          <div class="info-button">
            <button class="btn-counting btn-big"> <img src="icons/play.svg" alt="">Continue Watching</button>
            <button class="btn-add btn-big"> <img src="icons/bookmark.svg" alt="">Add Watchlist</button>
          </div>
        </div> -->

      <!-- <div class="actions">
          <button class="actions__btn btn-big"><img src="icons/download.svg" alt="">Download</button>
          <button class="actions__btn btn-big"><img src="icons/share.svg" alt="">Share</button>
          <button class="actions__btn btn-big"><img src="icons/thumb-up.svg" alt="">Like</button>
        </div> -->

    </div>
    </div>
  </header>
  <div class="main">
    <div class="container">
      <h1 id="popular" class="movie__title">Popular</h1>
      <div class="arrow">
        <button id="btn-prev-popular" class="arrow-btn btn-big arrow-right"><img src="icons/arrow-left.svg"
            alt="arrow-right"></button>
        <button id="btn-next-popular" class="arrow-btn btn-big arrow-left"><img src="icons/arrow-right.svg"
            alt="arrow-left"></button>
      </div>
      <div id="popular-container" class="movies"></div>
    </div>

    <div class="container">
      <h1 id="movies" class="movie__title">Movies</h1>
      <div class="arrow">
        <button id="btn-prev-movies" class="arrow-btn btn-big arrow-right"><img src="icons/arrow-left.svg"
            alt="arrow-right"></button>
        <button id="btn-next-movies" class="arrow-btn btn-big arrow-left"><img src="icons/arrow-right.svg"
            alt="arrow-left"></button>
      </div>
      <div id="movies-container" class="movies"></div>
    </div>

    <div class="container">
      <h1 id="series" class="movie__title">Series</h1>
      <div class="arrow">
        <button id="btn-prev-series" class="arrow-btn btn-big arrow-right"><img src="icons/arrow-left.svg"
            alt="arrow-right"></button>
        <button id="btn-next-series" class="arrow-btn btn-big arrow-left"><img src="icons/arrow-right.svg"
            alt="arrow-left"></button>
      </div>
      <div id="series-container" class="movies"></div>
    </div>

    <div class="container">
      <h1 id="cartoons" class="movie__title">Сartoons</h1>
      <div class="arrow">
        <button id="btn-prev-cartoons" class="arrow-btn btn-big arrow-right"><img src="icons/arrow-left.svg"
            alt="arrow-right"></button>
        <button id="btn-next-cartoons" class="arrow-btn btn-big arrow-left"><img src="icons/arrow-right.svg"
            alt="arrow-left"></button>
      </div>
      <div id="cartoons-container" class="movies"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer__container">
      <div class="content">
        <h3 class="content__title">Our platform is trusted by millions & features best updated movies all around the
          world.</h3>
        <div class="content-system">
          <a href="#" class="content__desc">Privacy policy</a>
          <a href="#" class="content__desc">Term of service</a>
          <a href="#" class="content__desc">Language</a>
        </div>
      </div>
      <div class="services">
        <div class="services-section">
          <p class="services__desc">Home /</p>
          <p class="services__desc">Discover /</p>
          <p class="services__desc">Influence /</p>
          <p class="services__desc">Release </p>
        </div>

        <div class="services-coz">
          <img src="icons/Instagram.svg" alt="instagram" class="img-btn">
          <img src="icons/Facebook.svg" alt="instagram" class="img-btn">
          <img src="icons/Twitter.svg" alt="instagram" class="img-btn">
          <img src="icons/Google.svg" alt="instagram" class="img-btn">
        </div>
        <div class="services-age">© 2023
        </div>

      </div>
    </div>
  </footer>


</body>

</html>
